# Every list and run process receives its own private HOME/MARE_HOME before test code starts.
# Any new wrapper must compose this isolation instead of replacing it: only the first match wins.
nextest-version = { required = "0.9.138" }
experimental = ["wrapper-scripts"]

[scripts.wrapper.mare-home-unix]
command = ['python3', '-c', 'import os,runpy; runpy.run_path(os.path.join(os.environ["NEXTEST_WORKSPACE_ROOT"],"scripts","nextest_test_home.py"), run_name="__main__")']
target-runner = 'within-wrapper'

[scripts.wrapper.mare-home-windows]
command = ['python', '-c', 'import os,runpy; runpy.run_path(os.path.join(os.environ["NEXTEST_WORKSPACE_ROOT"],"scripts","nextest_test_home.py"), run_name="__main__")']
target-runner = 'within-wrapper'

[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = { period = "2s", result = "fail" }

[[profile.default.scripts]]
platform = { host = 'cfg(unix)' }
list-wrapper = 'mare-home-unix'
run-wrapper = 'mare-home-unix'

[[profile.default.scripts]]
platform = { host = 'cfg(windows)' }
list-wrapper = 'mare-home-windows'
run-wrapper = 'mare-home-windows'

[[profile.default.overrides]]
filter = "package(mare-binding) and (test(/ossandbox::host_protection_tests::/) or test(/http_serve::sec_tests::/))"
success-output = "immediate-final"

[profile.gate]
# retry once so one transient failure (a loaded runner) doesn't fail the gate outright,
# but any test that passes only on retry still fails the run (flaky-result = "fail").
retries = 1
flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = { period = "2s", result = "fail" }
test-threads = 6
failure-output = "immediate-final"
fail-fast = false
# the final summary lists every test that passed only after a retry ("FLAKY n/m"), and
# flaky-result = "fail" ensures a retried test fails the gate run.
final-status-level = "flaky"

[[profile.gate.scripts]]
platform = { host = 'cfg(unix)' }
list-wrapper = 'mare-home-unix'
run-wrapper = 'mare-home-unix'

[[profile.gate.scripts]]
platform = { host = 'cfg(windows)' }
list-wrapper = 'mare-home-windows'
run-wrapper = 'mare-home-windows'

[[profile.gate.overrides]]
filter = "package(mare-binding) and (test(/ossandbox::host_protection_tests::/) or test(/http_serve::sec_tests::/))"
success-output = "immediate-final"

[profile.gate.junit]
path = "junit.xml"

[profile.ci]
retries = 2
flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = { period = "2s", result = "fail" }
test-threads = 4
failure-output = "immediate-final"
fail-fast = false
final-status-level = "flaky"

[[profile.ci.scripts]]
platform = { host = 'cfg(unix)' }
list-wrapper = 'mare-home-unix'
run-wrapper = 'mare-home-unix'

[[profile.ci.scripts]]
platform = { host = 'cfg(windows)' }
list-wrapper = 'mare-home-windows'
run-wrapper = 'mare-home-windows'

[[profile.ci.overrides]]
filter = "package(mare-binding) and (test(/ossandbox::host_protection_tests::/) or test(/http_serve::sec_tests::/))"
success-output = "immediate-final"

[test-groups.pty]
max-threads = 2

[test-groups.sandbox]
max-threads = 2

[[profile.default.overrides]]
filter = 'package(mare-cli) & (test(/pty/) | test(/tui_pty/))'
test-group = 'pty'

[[profile.default.overrides]]
filter = 'package(mare-cli) & (test(/sandbox/) | test(/deny_read/) | test(/win_sandbox/) | test(/net_proxy_linux/))'
test-group = 'sandbox'

[profile.live]
# real-model runs (`just live`): a task can take minutes — glm-5.3-flash has reasoned ~10k tokens
# for minutes on the candy puzzle while streaming the whole time — so 16 minutes before giving up
slow-timeout = { period = "120s", terminate-after = 8 }
test-threads = 3
failure-output = "immediate-final"
fail-fast = false

[[profile.live.scripts]]
platform = { host = 'cfg(unix)' }
list-wrapper = 'mare-home-unix'
run-wrapper = 'mare-home-unix'

[[profile.live.scripts]]
platform = { host = 'cfg(windows)' }
list-wrapper = 'mare-home-windows'
run-wrapper = 'mare-home-windows'
