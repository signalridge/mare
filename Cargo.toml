[workspace]
resolver        = "3"
members         = [ "crates/*" ]
default-members = [ "crates/mare-cli" ]

[workspace.package]
edition      = "2024"
version      = "1.0.0"
license      = "Apache-2.0"
authors      = [ "signalridge" ]
repository   = "https://github.com/signalridge/mare"
rust-version = "1.100.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# hot-path crates optimised even in dev and test builds: the
# Lua VM (every test boots ~35 plugins), Markdown, highlighting and its regex engine, JSON, and
# the renderer. Dependencies compile once, so only a clean build pays; mare-tui rebuilds a little
# slower when it changes, mare-cli / mare-host / mare-binding stay unoptimised (fast incremental).
[profile.dev.package.mlua-sys]
opt-level = 3
[profile.dev.package.mlua]
opt-level = 3
[profile.dev.package.pulldown-cmark]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.unicode-segmentation]
opt-level = 3
[profile.dev.package.mare-tui]
opt-level = 3

[profile.release]
opt-level     = "s"  # keep cold CLI/RPC/schema/binding glue compact (.text & RssFile); hot inner-loop crates override to 3 below
codegen-units = 1
lto           = true
panic         = "unwind"  # mlua turns panics in Rust callbacks into Lua errors (plugin isolation); abort would kill the process
strip         = "debuginfo"  # keep the symbol table: crash-report backtraces show function names

# Hot inner-loop crates stay at opt-level = 3 in release builds (Lua 5.5 VM, TUI/Markdown/syntax/regex/JSON/diff/allocator/crypto/SQLite).
[profile.release.package.mlua-sys]
opt-level = 3
[profile.release.package.mare-tui]
opt-level = 3
[profile.release.package.pulldown-cmark]
opt-level = 3
[profile.release.package.syntect]
opt-level = 3
[profile.release.package.fancy-regex]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.regex-syntax]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3
[profile.release.package.unicode-segmentation]
opt-level = 3
[profile.release.package.similar]
opt-level = 3
[profile.release.package.libmimalloc-sys]
opt-level = 3
[profile.release.package.aws-lc-sys]
opt-level = 3
[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.dev-opt]
inherits      = "release"
codegen-units = 256
debug         = true
incremental   = true
lto           = false
strip         = false

[workspace.dependencies]
lru = "0.19"
shlex = "2"
# command parsing for permission rules
tree-sitter = { version = "0.27", default-features = false, features = ["std"] }
tree-sitter-bash = "0.25"
# canonical paths without the Windows `\\?\` verbatim prefix
dunce = "1.0"
mare-binding = { path = "crates/mare-binding" }
mare-config  = { path = "crates/mare-config" }
mare-edit    = { path = "crates/mare-edit" }
mare-host    = { path = "crates/mare-host" }
mare-kernel  = { path = "crates/mare-kernel" }
mare-macro   = { path = "crates/mare-macro" }
mare-plugin-manager     = { path = "crates/mare-plugin-manager" }
mare-plugin  = { path = "crates/mare-plugin" }
mare-protocol = { path = "crates/mare-protocol" }
mare-shared  = { path = "crates/mare-shared" }
mare-store   = { path = "crates/mare-store" }
mare-tui     = { path = "crates/mare-tui" }

tokio = { version = "1.54", features = ["full"] }
mlua = { version = "0.12", features = ["lua55", "vendored", "async", "serde", "macros", "error-send", "userdata-wrappers", "anyhow"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
termina = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
syntect = { version = "5.3", default-features = false, features = ["regex-fancy", "parsing", "dump-load", "default-syntaxes"] }
unicode-width = "0.2"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category", "emoji"] }
unicode-segmentation = "1.13"
similar = "3.2"
ignore = "0.4"
globset = "0.4"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] } # schema property order (x-mare-order) and exact decimal validation
serde_path_to_error = "0.1"
schemars = "1.2"
clap = { version = "4.6", features = ["derive", "string"] }
clap_complete = "4.6"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
futures-util = "0.3"
rrule = "0.14"
open = "5.4"
uuid = { version = "1.29", features = ["v4", "v7"] }
nucleo-matcher = "0.3"
jiff = "0.2"
which = "8.0"
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
agent-client-protocol = { version = "5.0", features = ["stdio"] }
tokio-util = "0.7"
url = "2.5"
# HTTP/1.x request-head parsing for the sandbox proxy (already built via hyper)
httparse = "1.10"
libc = "0.2"
signal-hook-registry = "1.4"
bytes = "1.12"
sha2 = "0.11"
subtle = "2.6"
base64 = "0.23"
rand = "0.10"
dirs = "7.0"
tempfile = "3.27"
insta = { version = "1.49", default-features = false } # snapshot tests (dev only)
pretty_assertions = "1.4" # readable diffs in test assertions (dev only)
# SKILL.md / prompt-template frontmatter: YAML 1.2, pure safe Rust, MIT OR Apache-2.0
yaml-rust2 = { version = "0.13", default-features = false }
rmcp = { version = "3.9", default-features = false }
async-trait = "0.1"
hyper = { version = "1.12", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = "0.1"
http = "1.5"
memchr = "2.8"
tokio-tungstenite = { version = "0.30", default-features = false }
rustls = { version = "0.23", default-features = false }
rustls-pki-types = "1.16"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-platform-verifier = "0.7"
encoding_rs = "0.8"
chardetng = "1.0"
htmd = { version = "0.6", default-features = false, features = ["rcdom"] }
html5ever = "0.40"
markup5ever_rcdom = "0.40"
codepage = "0.1"
windows-sys = "0.61"
# session metadata index: rebuildable from the session files; bundled SQLite
# (public domain) so every platform gets the same version and no system library is needed
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
landlock = "0.4"
vt100 = "0.18"
semver = "1.0"
toml = { version = "1.2", default-features = false }
file-rotate = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rustc-hash = "2.1"
quantette = { version = "0.6", default-features = false }
# Exact pin (=0.61.2, matching Cargo.lock) for multiple_of workaround; see crates/mare-shared/src/schema/multiple_of.rs
jsonschema = { version = "=0.61.2", default-features = false, features = ["arbitrary-precision"] }

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock         = "deny"
await_holding_refcell_ref  = "deny"
dbg_macro                  = "deny"
disallowed_methods         = "deny"
format_push_string         = "warn"
if_same_then_else          = "allow"
implicit_clone             = "warn"
len_without_is_empty       = "allow"
missing_safety_doc         = "allow"
module_inception           = "allow"
option_map_unit_fn         = "allow"
todo                       = "deny"
unit_arg                   = "allow"
use_self                   = "warn"

[workspace.metadata.cargo-shear]
ignored = [ "tracing" ]
