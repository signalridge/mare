<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" class="mare-svg mare-svg-sbx" role="img" aria-labelledby="sbx-title sbx-desc">
  <title id="sbx-title">Three-platform OS sandbox backends and probed capabilities</title>
  <desc id="sbx-desc">Comparison of Linux bwrap, Linux Landlock fallback, macOS Seatbelt, Windows windows-acl default tier, and Windows windows-user enhanced tier across mare's eight capability dimensions, separating declared capabilities from partial or setup-time handling, plus the fail-closed enforcement contract (SANDBOX_INSUFFICIENT and SANDBOX_UNAVAILABLE).</desc>
  <defs>
    <style>
      .mare-svg-sbx {
        --bg: #0e0f17;
        --panel: #151724;
        --card: #1c1f30;
        --row-alt: rgba(255, 255, 255, 0.025);
        --line: #2a2f46;
        --ink: #f3f4fb;
        --ink2: #b4b9d4;
        --ink3: #8c92b0;
        --violet: #a0a4ff;
        --violet-bg: rgba(160, 164, 255, 0.11);
        --violet-line: rgba(160, 164, 255, 0.45);
        --coral: #ffa38f;
        --coral-bg: rgba(255, 163, 143, 0.11);
        --coral-line: rgba(255, 163, 143, 0.46);
        --ok: #7be0b4;
        --ok-bg: rgba(123, 224, 180, 0.14);
        --warn: #f4c97a;
        --warn-bg: rgba(244, 201, 122, 0.14);
        --none: #666c8a;
        font-family: 'Inter Variable', 'Inter', system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) .mare-svg-sbx,
        svg.mare-svg-sbx:root {
          --bg: #fbfbfd;
          --panel: #f3f4fa;
          --card: #ffffff;
          --row-alt: rgba(20, 22, 36, 0.025);
          --line: #d8dceb;
          --ink: #141624;
          --ink2: #484e6e;
          --ink3: #646b8c;
          --violet: #5256d4;
          --violet-bg: rgba(82, 86, 212, 0.08);
          --violet-line: rgba(82, 86, 212, 0.42);
          --coral: #c44f35;
          --coral-bg: rgba(255, 163, 143, 0.16);
          --coral-line: rgba(196, 79, 53, 0.42);
          --ok: #1b7f5a;
          --ok-bg: rgba(27, 127, 90, 0.11);
          --warn: #9a6510;
          --warn-bg: rgba(154, 101, 16, 0.12);
          --none: #949ab5;
        }
      }
      :root[data-theme='light'] .mare-svg-sbx {
        --bg: #fbfbfd;
        --panel: #f3f4fa;
        --card: #ffffff;
        --row-alt: rgba(20, 22, 36, 0.025);
        --line: #d8dceb;
        --ink: #141624;
        --ink2: #484e6e;
        --ink3: #646b8c;
        --violet: #5256d4;
        --violet-bg: rgba(82, 86, 212, 0.08);
        --violet-line: rgba(82, 86, 212, 0.42);
        --coral: #c44f35;
        --coral-bg: rgba(255, 163, 143, 0.16);
        --coral-line: rgba(196, 79, 53, 0.42);
        --ok: #1b7f5a;
        --ok-bg: rgba(27, 127, 90, 0.11);
        --warn: #9a6510;
        --warn-bg: rgba(154, 101, 16, 0.12);
        --none: #949ab5;
      }
      .mare-svg-sbx text { user-select: text; }
      .sbx-hd { font-family: 'Space Grotesk', 'Inter Variable', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); }
      .sbx-col-os { font-size: 11px; font-weight: 600; fill: var(--violet); }
      .sbx-col-name { font-family: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, monospace; font-size: 12.2px; font-weight: 600; fill: var(--ink); }
      .sbx-col-sub { font-size: 9.8px; fill: var(--ink3); }
      .sbx-cap { font-family: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, monospace; font-size: 11.8px; font-weight: 600; fill: var(--ink); }
      .sbx-cap-sub { font-size: 10.6px; fill: var(--ink2); }
      .sbx-yes { font-family: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, monospace; font-size: 11.2px; font-weight: 600; fill: var(--ok); }
      .sbx-part { font-family: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, monospace; font-size: 10.2px; font-weight: 600; fill: var(--warn); }
      .sbx-no { font-family: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, monospace; font-size: 12px; fill: var(--none); }
      .sbx-note { font-size: 9.7px; fill: var(--ink2); }
      .sbx-code { font-family: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, monospace; font-size: 10.6px; font-weight: 600; fill: var(--coral); }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="584" rx="14" fill="var(--bg)"/>

  <!-- Header -->
  <text x="28" y="38" class="sbx-hd">Three-platform OS sandbox backends</text>
  <text x="886" y="38" text-anchor="end" class="sbx-col-sub">Probed on demand &amp; cached (ossandbox/backend.rs · caps.rs)</text>

  <!-- Matrix container -->
  <rect x="24" y="52" width="912" height="394" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/>

  <!-- Column headers -->
  <rect x="24" y="52" width="912" height="68" rx="12" fill="var(--card)"/>
  <line x1="24" y1="120" x2="936" y2="120" stroke="var(--line)" stroke-width="1.2"/>

  <text x="42" y="83" class="sbx-col-name">Cap dimension</text>
  <text x="42" y="102" class="sbx-col-sub">Declared only when runtime probe passes</text>

  <!-- 5 Backend columns: centers at 362, 492, 622, 750, 876 -->
  <g text-anchor="middle">
    <text x="362" y="72" class="sbx-col-os">Linux · primary</text>
    <text x="362" y="90" class="sbx-col-name">bwrap</text>
    <text x="362" y="107" class="sbx-col-sub">userns + netns + seccomp</text>

    <text x="492" y="72" class="sbx-col-os">Linux · fallback</text>
    <text x="492" y="90" class="sbx-col-name">landlock</text>
    <text x="492" y="107" class="sbx-col-sub">LSM paths + seccomp</text>

    <text x="622" y="72" class="sbx-col-os">macOS</text>
    <text x="622" y="90" class="sbx-col-name">seatbelt</text>
    <text x="622" y="107" class="sbx-col-sub">sandbox-exec profile</text>

    <text x="750" y="72" class="sbx-col-os" style="fill: var(--coral);">Windows · default</text>
    <text x="750" y="90" class="sbx-col-name">windows-acl</text>
    <text x="750" y="107" class="sbx-col-sub">restricted token + Low IL</text>

    <text x="876" y="72" class="sbx-col-os" style="fill: var(--coral);">Windows · enhanced</text>
    <text x="876" y="90" class="sbx-col-name">windows-user</text>
    <text x="876" y="107" class="sbx-col-sub">sandbox user · ACL/WFP</text>
  </g>

  <!-- Vertical column dividers -->
  <g stroke="var(--line)" stroke-width="1" opacity="0.65">
    <line x1="296" y1="52" x2="296" y2="446"/>
    <line x1="428" y1="52" x2="428" y2="446"/>
    <line x1="556" y1="52" x2="556" y2="446"/>
    <line x1="686" y1="52" x2="686" y2="446"/>
    <line x1="814" y1="52" x2="814" y2="446"/>
  </g>

  <!-- Row 1: fs_write -->
  <g>
    <text x="42" y="138" class="sbx-cap">fs_write</text>
    <text x="42" y="153" class="sbx-cap-sub">Confine writes to allowed roots</text>
    <g text-anchor="middle">
      <rect x="330" y="128" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="362" y="144" class="sbx-yes">✓ probe</text>
      <rect x="460" y="128" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="492" y="144" class="sbx-yes">✓ probe</text>
      <rect x="590" y="128" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="622" y="144" class="sbx-yes">✓ probe</text>
      <rect x="718" y="128" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="750" y="144" class="sbx-yes">✓ probe</text>
      <rect x="844" y="128" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="876" y="144" class="sbx-yes">✓ probe</text>
    </g>
    <line x1="24" y1="160" x2="936" y2="160" stroke="var(--line)" opacity="0.6"/>
  </g>

  <!-- Row 2: fs_read -->
  <g>
    <rect x="24" y="160" width="912" height="41" fill="var(--row-alt)"/>
    <text x="42" y="179" class="sbx-cap">fs_read</text>
    <text x="42" y="194" class="sbx-cap-sub">Restrict reads to allowed roots</text>
    <g text-anchor="middle">
      <rect x="330" y="169" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="362" y="185" class="sbx-yes">✓ probe</text>
      <rect x="460" y="169" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="492" y="185" class="sbx-yes">✓ probe</text>
      <rect x="590" y="169" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="622" y="185" class="sbx-yes">✓ probe</text>
      <text x="750" y="185" class="sbx-no">—</text>
      <text x="876" y="185" class="sbx-no">—</text>
    </g>
    <line x1="24" y1="201" x2="936" y2="201" stroke="var(--line)" opacity="0.6"/>
  </g>

  <!-- Row 3: fs_protect -->
  <g>
    <text x="42" y="220" class="sbx-cap">fs_protect</text>
    <text x="42" y="235" class="sbx-cap-sub">Keep .git and .mare read-only</text>
    <g text-anchor="middle">
      <rect x="330" y="210" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="362" y="226" class="sbx-yes">✓ probe</text>
      <text x="492" y="226" class="sbx-no">—</text>
      <rect x="590" y="210" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="622" y="226" class="sbx-yes">✓ probe</text>
      <text x="750" y="226" class="sbx-no">—</text>
      <text x="876" y="226" class="sbx-no">—</text>
    </g>
    <line x1="24" y1="242" x2="936" y2="242" stroke="var(--line)" opacity="0.6"/>
  </g>

  <!-- Row 4: fs_host_protect -->
  <g>
    <rect x="24" y="242" width="912" height="41" fill="var(--row-alt)"/>
    <text x="42" y="261" class="sbx-cap">fs_host_protect</text>
    <text x="42" y="276" class="sbx-cap-sub">Hide host runtime secret dirs</text>
    <g text-anchor="middle">
      <rect x="330" y="251" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="362" y="267" class="sbx-yes">✓ probe</text>
      <text x="492" y="267" class="sbx-no">—</text>
      <rect x="590" y="251" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="622" y="267" class="sbx-yes">✓ probe</text>
      <text x="750" y="267" class="sbx-no">—</text>
      <rect x="836" y="251" width="80" height="24" rx="6" fill="var(--ok-bg)"/><text x="876" y="267" class="sbx-yes">✓ if setup</text>
    </g>
    <line x1="24" y1="283" x2="936" y2="283" stroke="var(--line)" opacity="0.6"/>
  </g>

  <!-- Row 5: net_block -->
  <g>
    <text x="42" y="302" class="sbx-cap">net_block</text>
    <text x="42" y="317" class="sbx-cap-sub">Kernel blocks all network I/O</text>
    <g text-anchor="middle">
      <rect x="330" y="292" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="362" y="308" class="sbx-yes">✓ netns</text>
      <rect x="454" y="292" width="76" height="24" rx="6" fill="var(--ok-bg)"/><text x="492" y="308" class="sbx-yes">✓ seccomp</text>
      <rect x="590" y="292" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="622" y="308" class="sbx-yes">✓ probe</text>
      <text x="750" y="308" class="sbx-no">—</text>
      <text x="876" y="308" class="sbx-no">— ¹</text>
    </g>
    <line x1="24" y1="324" x2="936" y2="324" stroke="var(--line)" opacity="0.6"/>
  </g>

  <!-- Row 6: net_proxy -->
  <g>
    <rect x="24" y="324" width="912" height="41" fill="var(--row-alt)"/>
    <text x="42" y="343" class="sbx-cap">net_proxy</text>
    <text x="42" y="358" class="sbx-cap-sub">Force traffic via local filter proxy</text>
    <g text-anchor="middle">
      <rect x="326" y="333" width="72" height="24" rx="6" fill="var(--ok-bg)"/><text x="362" y="349" class="sbx-yes">✓ bridge</text>
      <text x="492" y="349" class="sbx-no">—</text>
      <rect x="590" y="333" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="622" y="349" class="sbx-yes">✓ probe</text>
      <text x="750" y="349" class="sbx-no">—</text>
      <text x="876" y="349" class="sbx-no">— ¹</text>
    </g>
    <line x1="24" y1="365" x2="936" y2="365" stroke="var(--line)" opacity="0.6"/>
  </g>

  <!-- Row 7: unix_socket -->
  <g>
    <text x="42" y="384" class="sbx-cap">unix_socket</text>
    <text x="42" y="399" class="sbx-cap-sub">Restrict local daemon sockets</text>
    <g text-anchor="middle">
      <rect x="326" y="374" width="72" height="24" rx="6" fill="var(--ok-bg)"/><text x="362" y="390" class="sbx-yes">✓ all ²</text>
      <rect x="456" y="374" width="72" height="24" rx="6" fill="var(--ok-bg)"/><text x="492" y="390" class="sbx-yes">✓ all ²</text>
      <rect x="582" y="374" width="80" height="24" rx="6" fill="var(--ok-bg)"/><text x="622" y="390" class="sbx-yes">✓ + allow</text>
      <rect x="718" y="374" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="750" y="390" class="sbx-yes">✓ n/a ³</text>
      <rect x="844" y="374" width="64" height="24" rx="6" fill="var(--ok-bg)"/><text x="876" y="390" class="sbx-yes">✓ n/a ³</text>
    </g>
    <line x1="24" y1="406" x2="936" y2="406" stroke="var(--line)" opacity="0.6"/>
  </g>

  <!-- Row 8: fs_deny_read -->
  <g>
    <rect x="24" y="406" width="912" height="40" fill="var(--row-alt)"/>
    <text x="42" y="424" class="sbx-cap">fs_deny_read</text>
    <text x="42" y="439" class="sbx-cap-sub">Per-call explicit deny_read paths</text>
    <g text-anchor="middle">
      <rect x="311" y="414" width="102" height="24" rx="6" fill="var(--warn-bg)"/><text x="362" y="430" class="sbx-part">not declared ⁴</text>
      <text x="492" y="430" class="sbx-no">—</text>
      <rect x="571" y="414" width="102" height="24" rx="6" fill="var(--warn-bg)"/><text x="622" y="430" class="sbx-part">not declared ⁴</text>
      <text x="750" y="430" class="sbx-no">—</text>
      <rect x="823" y="414" width="106" height="24" rx="6" fill="var(--warn-bg)"/><text x="876" y="430" class="sbx-part">not declared ⁵</text>
    </g>
  </g>

  <!-- Footnotes -->
  <text x="28" y="466" class="sbx-note">¹ Windows WFP proxy ports are shared across calls (net_block / net_proxy not declared).  ² Linux seccomp blocks all AF_UNIX (no per-socket allowlist).</text>
  <text x="28" y="482" class="sbx-note">³ No Unix-socket daemons on Windows.  ⁴ bwrap/Seatbelt apply deny_read masks/rules with alias caveats; strict calls need explicit accept_partial.</text>
  <text x="28" y="498" class="sbx-note">⁵ windows-user configures setup-time deny-read ACLs (mare sandbox setup), but does not declare per-call fs_deny_read; strict deny_read calls are refused.</text>

  <!-- Bottom Fail-Closed Contract Banner -->
  <rect x="24" y="510" width="912" height="54" rx="10" fill="var(--coral-bg)" stroke="var(--coral-line)" stroke-width="1.3"/>
  <text x="42" y="532" class="sbx-cap" style="fill: var(--coral);">Fail-closed enforcement contract</text>
  <text x="42" y="550" class="sbx-note">
    Missing required Cap → <tspan class="sbx-code">SANDBOX_INSUFFICIENT</tspan> (unless listed in accept_partial) · No backend usable → <tspan class="sbx-code">SANDBOX_UNAVAILABLE</tspan> · Never runs unconfined silently
  </text>
</svg>
