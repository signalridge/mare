# cargo-about configuration for licenses/RUST-THIRD-PARTY-NOTICES.txt, generated at release
# time by scripts/check_notices.py --generate-rust-notices. `accepted` must equal
# deny.toml [licenses].allow (scripts/check_notices.py enforces it).
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

ignore-dev-dependencies = true
