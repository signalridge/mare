name: Set up pinned Rust
description: Install the Rust toolchain and components pinned in rust-toolchain.toml.

inputs:
  targets:
    description: Comma-separated extra target triples to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read rust-toolchain.toml
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        file=rust-toolchain.toml
        channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$file")"
        components="$(sed -n 's/^[[:space:]]*components[[:space:]]*=[[:space:]]*\[\(.*\)\].*/\1/p' "$file" \
          | tr -d '" \r')"
        if [[ ! "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          printf '::error::%s must pin channel = "X.Y.Z", got %q\n' "$file" "$channel"
          exit 1
        fi
        printf 'toolchain=%s\ncomponents=%s\n' "$channel" "$components" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: ${{ steps.pin.outputs.toolchain }}
        components: ${{ steps.pin.outputs.components }}
        targets: ${{ inputs.targets }}
