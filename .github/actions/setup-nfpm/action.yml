name: Set up pinned nfpm
description: Install and verify the nfpm release pinned in .github/ci-tools.json (Linux x86_64 runners).

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - name: Download, verify, and extract nfpm
      shell: bash
      run: |
        set -euo pipefail
        nfpm_ver="$(jq -er '.nfpm.version | strings' .github/ci-tools.json)"
        nfpm_sha="$(jq -er '.nfpm.sha256 | strings' .github/ci-tools.json)"
        if [[ ! "$nfpm_sha" =~ ^[0-9a-f]{64}$ ]]; then
          printf '::error::Invalid .nfpm.sha256 in .github/ci-tools.json: %s\n' "$nfpm_sha"
          exit 1
        fi
        dir="${RUNNER_TEMP}/nfpm"
        rm -rf "$dir"
        mkdir -p "$dir"
        base_url="https://github.com/goreleaser/nfpm/releases/download/v${nfpm_ver}"
        asset="nfpm_${nfpm_ver}_Linux_x86_64.tar.gz"
        curl -fsSL -o "${dir}/checksums.txt" "${base_url}/checksums.txt"
        curl -fsSL -o "${dir}/checksums.txt.sigstore.json" "${base_url}/checksums.txt.sigstore.json"
        cert_id="https://github.com/goreleaser/nfpm/.github/workflows/release.yml@refs/tags/v${nfpm_ver}"
        cosign verify-blob \
          --bundle "${dir}/checksums.txt.sigstore.json" \
          --certificate-identity "${cert_id}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "${dir}/checksums.txt"
        curl -fsSL -o "${dir}/${asset}" "${base_url}/${asset}"
        (
          cd "$dir"
          match_count="$(awk -v a="$asset" '$2 == a' checksums.txt | wc -l)"
          if [[ "$match_count" -ne 1 ]]; then
            printf '::error::Expected exactly 1 checksum entry for %s in nfpm checksums.txt, found %s\n' \
              "$asset" "$match_count"
            exit 1
          fi
          awk -v a="$asset" '$2 == a' checksums.txt | sha256sum -c -
          printf '%s  %s\n' "$nfpm_sha" "$asset" | sha256sum -c -
        )
        tar -xzf "${dir}/${asset}" -C "$dir" nfpm
        rm -f "${dir}/${asset}" "${dir}/checksums.txt" "${dir}/checksums.txt.sigstore.json"
        echo "$dir" >> "$GITHUB_PATH"
