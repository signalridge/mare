name: Nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - ".github/workflows/nix.yaml"
  pull_request:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - ".github/workflows/nix.yaml"
  workflow_dispatch:

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: Check flake
        run: nix flake check --no-build

  build:
    name: Nix Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: Build package
        run: nix build .#mare
      - name: Test binary
        run: |
          set -euo pipefail
          ./result/bin/mare --version
          ./result/bin/mare --help >/dev/null
      - name: Test plugin sync with clean PATH (fallback git)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/repo/plugins/smoke" "$tmp/home/config"
          printf 'return { name = "smoke" }\n' > "$tmp/repo/plugins/smoke/init.lua"
          git -C "$tmp/repo" init -q -b main
          git -C "$tmp/repo" config user.name test
          git -C "$tmp/repo" config user.email test@example.invalid
          git -C "$tmp/repo" add -A
          git -C "$tmp/repo" -c commit.gpgsign=false commit -q -m init
          printf 'mare.plugins.add { { "local/smoke", url = "%s" } }\n' "$tmp/repo" > "$tmp/home/config/init.lua"
          env -i HOME="$tmp/home" MARE_HOME="$tmp/home" PATH="/nonexistent" \
            "$PWD/result/bin/mare" plugin sync
          grep -F '"local/smoke"' "$tmp/home/config/mare-lock.json"

  devshell:
    name: Dev Shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: Test dev shell
        run: nix develop --command rustc --version
