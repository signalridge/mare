name: CI Dependency Update

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-deps-update
  cancel-in-progress: true

jobs:
  update-ci-deps:
    name: Update pinned Rust, CI tools, and workflow container digests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check latest Rust stable, tool releases, and Arch container digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib
          import urllib.request

          ua = "mare-ci-deps-update"
          gh_headers = {"Accept": "application/vnd.github+json", "User-Agent": ua}
          token = os.environ.get("GH_TOKEN")
          if token:
              gh_headers["Authorization"] = f"Bearer {token}"

          def latest_release_version(repo: str) -> str | None:
              url = f"https://api.github.com/repos/{repo}/releases/latest"
              req = urllib.request.Request(url, headers=gh_headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  rel = json.loads(resp.read().decode("utf-8"))
              if rel.get("draft") or rel.get("prerelease"):
                  return None
              ver = str(rel.get("tag_name", "")).lstrip("v").strip()
              return ver if re.fullmatch(r"\d+\.\d+\.\d+", ver) else None

          tools_path = pathlib.Path(".github/ci-tools.json")
          tools = json.loads(tools_path.read_text(encoding="utf-8"))
          changed = False

          for key, repo in (
              ("stylua", "JohnnyMorganz/StyLua"),
              ("luals", "LuaLS/lua-language-server"),
              ("ast_grep", "ast-grep/ast-grep"),
              ("cargo_about", "EmbarkStudios/cargo-about"),
          ):
              ver = latest_release_version(repo)
              if ver and ver != tools.get(key):
                  tools[key] = ver
                  changed = True
                  print(f"Updated {key} -> {ver}")

          nfpm_ver = latest_release_version("goreleaser/nfpm")
          cur_nfpm = tools.get("nfpm")
          cur_nfpm_ver = cur_nfpm.get("version") if isinstance(cur_nfpm, dict) else cur_nfpm
          if nfpm_ver and nfpm_ver != cur_nfpm_ver:
              asset = f"nfpm_{nfpm_ver}_Linux_x86_64.tar.gz"
              cs_url = f"https://github.com/goreleaser/nfpm/releases/download/v{nfpm_ver}/checksums.txt"
              cs_req = urllib.request.Request(cs_url, headers={"User-Agent": ua})
              with urllib.request.urlopen(cs_req, timeout=30) as resp:
                  cs_text = resp.read().decode("utf-8")
              nfpm_sha = None
              for line in cs_text.splitlines():
                  parts = line.split()
                  if len(parts) == 2 and parts[1] == asset and re.fullmatch(r"[0-9a-f]{64}", parts[0]):
                      nfpm_sha = parts[0]
                      break
              if nfpm_sha:
                  tools["nfpm"] = {"version": nfpm_ver, "sha256": nfpm_sha}
                  changed = True
                  print(f"Updated nfpm -> {nfpm_ver} ({nfpm_sha})")

          if changed:
              tools_path.write_text(json.dumps(tools, indent=2) + "\n", encoding="utf-8")

          # rust-toolchain.toml pins the exact latest stable Rust release.
          chan_req = urllib.request.Request(
              "https://static.rust-lang.org/dist/channel-rust-stable.toml", headers={"User-Agent": ua}
          )
          with urllib.request.urlopen(chan_req, timeout=30) as resp:
              stable = tomllib.loads(resp.read().decode("utf-8"))
          rust_ver = str(stable["pkg"]["rust"]["version"]).split(" ", 1)[0]
          if re.fullmatch(r"\d+\.\d+\.\d+", rust_ver):
              tc_path = pathlib.Path("rust-toolchain.toml")
              tc_text = tc_path.read_text(encoding="utf-8")
              tc_new = re.sub(r'(?m)^(channel\s*=\s*)"[^"]*"', rf'\g<1>"{rust_ver}"', tc_text)
              if tc_new != tc_text:
                  tc_path.write_text(tc_new, encoding="utf-8")
                  print(f"Updated rust-toolchain.toml -> {rust_ver}")

          # Refresh archlinux:base-devel digest in release.yaml (Dependabot docker only scans Dockerfiles).
          tok_url = (
              "https://auth.docker.io/token"
              "?service=registry.docker.io&scope=repository:library/archlinux:pull"
          )
          tok_req = urllib.request.Request(tok_url, headers={"User-Agent": ua})
          with urllib.request.urlopen(tok_req, timeout=30) as resp:
              reg_token = json.loads(resp.read().decode("utf-8"))["token"]
          man_url = "https://registry-1.docker.io/v2/library/archlinux/manifests/base-devel"
          man_req = urllib.request.Request(
              man_url,
              method="HEAD",
              headers={
                  "Authorization": f"Bearer {reg_token}",
                  "Accept": (
                      "application/vnd.oci.image.index.v1+json, "
                      "application/vnd.docker.distribution.manifest.list.v2+json"
                  ),
                  "User-Agent": ua,
              },
          )
          with urllib.request.urlopen(man_req, timeout=30) as resp:
              digest = (resp.headers.get("Docker-Content-Digest") or "").strip()
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              rel_path = pathlib.Path(".github/workflows/release.yaml")
              rel_text = rel_path.read_text(encoding="utf-8")
              updated = re.sub(
                  r"archlinux:base-devel@sha256:[0-9a-f]{64}",
                  f"archlinux:base-devel@{digest}",
                  rel_text,
              )
              if updated != rel_text:
                  rel_path.write_text(updated, encoding="utf-8")
                  print(f"Updated archlinux:base-devel -> {digest}")
          PY

      - name: Validate release and CI policy
        run: python3 scripts/check_release_policy.py

      - name: Check for version file changes
        id: diff
        run: |
          if git diff --quiet -- rust-toolchain.toml .github/ci-tools.json .github/workflows/release.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.GH_PAT }}
          branch: chore/update-ci-versions
          delete-branch: true
          commit-message: "chore(ci): update pinned Rust, CI tool versions, and container digests"
          title: "chore(ci): update pinned Rust, CI tool versions, and container digests"
          body: |
            Automated update of the Rust release in `rust-toolchain.toml`, `.github/ci-tools.json`,
            and the Arch Linux container digest in `.github/workflows/release.yaml`.

            This PR was created by `.github/workflows/ci-deps-update.yaml`.
          labels: |
            dependencies
            ci
